# Production overlay (Oracle Cloud VM or any Docker host).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Passing -f explicitly skips docker-compose.override.yml (dev ports + DEV_LOGIN).
# Replaces nginx with Caddy for automatic HTTPS. Redis stays internal-only.
services:
  nginx:
    profiles: ["local-proxy"]   # not started in production

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app1
      - app2
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
